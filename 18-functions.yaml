- name: functions
  hosts: local
  connection: local
  vars:
    technologies: DevOps,Shell,Ansible
    tags:
      Application: payment
      Environment: dev
    listtags:
    - key: Application
      value: payment
    - key: Environment
      value: dev
    ipaddress: 172.31.38.48
  tasks:
  - name: default variables
    ansible.builtin.debug:
      msg: "{{ name | default('Balu') }}"
  - name: string in to list
    ansible.builtin.debug:
      msg: "{{ technologies | split(',') }}"
  - name: dictonary to map
    ansible.builtin.debug:
      msg: " tags are: {{ tags|dict2items }}"
  - name: convert list in to map
    ansible.builtin.debug:
      msg: "tag map: {{ listtags | items2dict }}"
  - name: read yaml file to json file
    ansible.builtin.set_fact:
      student_yaml: "{{ lookup('file', 'student.yaml') | from_yaml }}"
  - name: yaml to json
    ansible.builtin.debug:
      msg: "json {{ student_yaml | to_json }}"
  - name: save json to file
    ansible.builtin.copy:
      dest: ./student-data.json
      content: "{{ student_yaml | to_nice_json  }}"
  - name: check ip address is valid or not
    ansible.builtin.debug:
      msg: "IP is: {{ ipaddress | ansible.utils.ipv4 }}"
  - name: using shell command
    ansible.builtin.command:
      cmd: uname -a
    register: uname_output
  - name: print output
    ansible.builtin.debug:
      msg: "{{ uname_output }}"